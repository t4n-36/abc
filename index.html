<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>関数カードゲーム</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #151b3d;
            --accent-blue: #00d4ff;
            --accent-purple: #b026ff;
            --accent-green: #00ff88;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --card-plus: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-substitute: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --card-inverse: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --player-color: #00ff88;
            --enemy-color: #ff4757;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .game-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5)); }
            to { filter: drop-shadow(0 0 20px rgba(176, 38, 255, 0.5)); }
        }

        .battle-area {
            display: grid;
            grid-template-rows: auto auto auto;
            gap: 40px;
            margin-bottom: 40px;
        }

        .function-display {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .function-display::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .function-display.player {
            border-color: var(--player-color);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }

        .function-display.enemy {
            border-color: var(--enemy-color);
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.2);
        }

        .function-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .function-label.player { color: var(--player-color); }
        .function-label.enemy { color: var(--enemy-color); }

        .function-formula {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            position: relative;
            z-index: 1;
            letter-spacing: 2px;
        }

        .turn-indicator {
            text-align: center;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: 700;
            border: 2px solid var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            font-family: 'Orbitron', sans-serif;
        }

        .enemy-next-action {
            text-align: center;
            padding: 15px;
            background: rgba(255, 71, 87, 0.1);
            border-radius: 10px;
            margin-top: 10px;
            font-size: 1rem;
            color: var(--enemy-color);
            border: 1px solid var(--enemy-color);
        }

        .hand-area {
            margin-bottom: 30px;
        }

        .hand-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--accent-blue);
        }

        .card-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 200px;
            padding: 20px;
            background: rgba(21, 27, 61, 0.5);
            border-radius: 20px;
            border: 2px dashed rgba(0, 212, 255, 0.3);
        }

        .card {
            width: 160px;
            height: 220px;
            background: var(--card-plus);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .card.selected {
            transform: translateY(-20px) scale(1.1);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.8);
            border-color: var(--accent-blue);
        }

        .card.substitute {
            background: var(--card-substitute);
        }

        .card.inverse {
            background: var(--card-inverse);
        }

        .card.merged {
            border: 3px solid gold;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        }

        .card-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .card-level {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
        }

        .card-description {
            font-size: 0.85rem;
            text-align: center;
            opacity: 0.9;
            line-height: 1.4;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Orbitron', sans-serif;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-use {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
        }

        .btn-use:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.5);
        }

        .btn-merge {
            background: linear-gradient(135deg, #f5af19, #f12711);
            color: white;
        }

        .btn-merge:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(245, 175, 25, 0.5);
        }

        .btn-end {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .btn-end:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(56, 239, 125, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .target-select {
            text-align: center;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid var(--accent-purple);
        }

        .target-select h3 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 15px;
            color: var(--accent-purple);
        }

        .target-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn-target {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border: 3px solid;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        .btn-target.player {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--player-color);
            color: var(--player-color);
        }

        .btn-target.enemy {
            background: rgba(255, 71, 87, 0.1);
            border-color: var(--enemy-color);
            color: var(--enemy-color);
        }

        .btn-target:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px currentColor;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid;
            max-width: 500px;
            animation: modalAppear 0.5s ease-out;
        }

        @keyframes modalAppear {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-content.victory {
            border-color: var(--player-color);
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.5);
        }

        .modal-content.defeat {
            border-color: var(--enemy-color);
            box-shadow: 0 0 50px rgba(255, 71, 87, 0.5);
        }

        .modal-content h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .modal-content.victory h2 {
            color: var(--player-color);
        }

        .modal-content.defeat h2 {
            color: var(--enemy-color);
        }

        .modal-content p {
            font-size: 1.3rem;
            margin-bottom: 30px;
        }

        .merge-mode-indicator {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, rgba(245, 175, 25, 0.2), rgba(241, 39, 17, 0.2));
            border: 2px solid #f5af19;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #f5af19;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .log {
            background: rgba(21, 27, 61, 0.8);
            border-radius: 15px;
            padding: 20px;
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid rgba(0, 212, 255, 0.2);
        }

        .log-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--accent-blue);
        }

        .log-entry {
            padding: 8px;
            margin-bottom: 5px;
            border-left: 3px solid var(--accent-blue);
            padding-left: 15px;
            font-size: 0.95rem;
            animation: logSlide 0.3s ease-out;
        }

        @keyframes logSlide {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .log-entry.player {
            border-left-color: var(--player-color);
            color: var(--player-color);
        }

        .log-entry.enemy {
            border-left-color: var(--enemy-color);
            color: var(--enemy-color);
        }

        @media (max-width: 768px) {
            .title { font-size: 1.8rem; }
            .function-formula { font-size: 1.8rem; }
            .card { width: 140px; height: 200px; }
            .btn { padding: 12px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">関数カードゲーム</h1>

        <div class="battle-area">
            <!-- 敵の関数 -->
            <div class="function-display enemy">
                <div class="function-label enemy">敵の関数</div>
                <div class="function-formula" id="enemy-function">g(x) = x² - 6</div>
                <div class="enemy-next-action" id="enemy-next-action">次の行動: 準備中...</div>
            </div>

            <!-- ターン表示 -->
            <div class="turn-indicator" id="turn-indicator">プレイヤーのターン</div>

            <!-- プレイヤーの関数 -->
            <div class="function-display player">
                <div class="function-label player">あなたの関数</div>
                <div class="function-formula" id="player-function">f(x) = x - 2</div>
            </div>
        </div>

        <!-- ターゲット選択 -->
        <div class="target-select" id="target-select" style="display: none;">
            <h3>カードを使用する対象を選択</h3>
            <div class="target-buttons">
                <button class="btn-target player" onclick="selectTarget('player')">自分の関数</button>
                <button class="btn-target enemy" onclick="selectTarget('enemy')">敵の関数</button>
            </div>
        </div>

        <!-- 合成モード表示 -->
        <div class="merge-mode-indicator" id="merge-indicator" style="display: none;">
            🔥 合成モード: 同じカードを2枚選択してください
        </div>

        <!-- 手札 -->
        <div class="hand-area">
            <div class="hand-label">手札</div>
            <div class="card-container" id="hand"></div>
        </div>

        <!-- アクションボタン -->
        <div class="actions">
            <button class="btn btn-use" id="btn-use" onclick="useCard()" disabled>カード使用</button>
            <button class="btn btn-merge" id="btn-merge" onclick="toggleMergeMode()">カード合成</button>
            <button class="btn btn-end" onclick="endTurn()">ターン終了</button>
        </div>

        <!-- ログ -->
        <div class="log">
            <div class="log-title">行動ログ</div>
            <div id="log"></div>
        </div>

        <!-- 勝敗モーダル -->
        <div class="modal" id="modal">
            <div class="modal-content" id="modal-content">
                <h2 id="modal-title"></h2>
                <p id="modal-message"></p>
                <button class="btn btn-use" onclick="location.reload()">再スタート</button>
            </div>
        </div>
    </div>

    <script>
        // ゲーム状態
        let gameState = {
            playerFunction: { coefficient: 1, exponent: 1, constant: -2 }, // x - 2
            enemyFunction: { coefficient: 1, exponent: 2, constant: -6 },  // x² - 6
            hand: [],
            selectedCardIndex: null,
            mergeMode: false,
            selectedForMerge: [],
            turn: 'player',
            enemyNextAction: null
        };

        // カードタイプ定義
        const cardTypes = {
            plus: { name: '+1カード', type: 'plus', description: 'f(x) + 1', color: 'plus' },
            substitute: { name: 'x=1代入', type: 'substitute', description: 'f(1) を計算', color: 'substitute' },
            inverse: { name: '逆数カード', type: 'inverse', description: '1/f(x)', color: 'inverse' }
        };

        // 初期化
        function init() {
            // 初期手札を配る
            gameState.hand = [
                { ...cardTypes.plus, level: 1, id: Date.now() + 1 },
                { ...cardTypes.plus, level: 1, id: Date.now() + 2 },
                { ...cardTypes.substitute, level: 1, id: Date.now() + 3 },
                { ...cardTypes.substitute, level: 1, id: Date.now() + 4 },
                { ...cardTypes.inverse, level: 1, id: Date.now() + 5 }
            ];

            // 敵の次の行動を決定
            decideEnemyNextAction();
            
            renderHand();
            renderFunctions();
            addLog('ゲーム開始！', 'player');
        }

        // 手札を描画
        function renderHand() {
            const handElement = document.getElementById('hand');
            handElement.innerHTML = '';

            gameState.hand.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = `card ${card.color}`;
                
                if (gameState.selectedCardIndex === index && !gameState.mergeMode) {
                    cardElement.classList.add('selected');
                }

                if (gameState.mergeMode && gameState.selectedForMerge.includes(index)) {
                    cardElement.classList.add('selected');
                }

                if (card.level > 1) {
                    cardElement.classList.add('merged');
                }

                cardElement.innerHTML = `
                    <div class="card-level">Lv${card.level}</div>
                    <div class="card-name">${card.name}</div>
                    <div class="card-description">${getCardDescription(card)}</div>
                `;

                cardElement.onclick = () => selectCard(index);
                handElement.appendChild(cardElement);
            });
        }

        // カードの説明文を取得
        function getCardDescription(card) {
            if (card.type === 'plus') {
                return card.level === 1 ? 'f(x) → f(x) + 1' : `f(x) → f(x) + ${card.level}`;
            } else if (card.type === 'substitute') {
                return `f(x) → f(${card.level})`;
            } else if (card.type === 'inverse') {
                if (card.level === 1) return 'f(x) → 1/f(x)';
                if (card.level === 2) return 'f(x) → f(x) (無効化)';
                return 'f(x) → f(x)';
            }
            return card.description;
        }

        // カードを選択
        function selectCard(index) {
            if (gameState.mergeMode) {
                // 合成モード
                if (gameState.selectedForMerge.includes(index)) {
                    gameState.selectedForMerge = gameState.selectedForMerge.filter(i => i !== index);
                } else if (gameState.selectedForMerge.length < 2) {
                    gameState.selectedForMerge.push(index);
                }

                // 2枚選択されたら合成実行
                if (gameState.selectedForMerge.length === 2) {
                    attemptMerge();
                }
            } else {
                // 通常モード
                gameState.selectedCardIndex = index;
                document.getElementById('btn-use').disabled = false;
            }
            renderHand();
        }

        // カード使用
        function useCard() {
            if (gameState.selectedCardIndex === null) return;

            const card = gameState.hand[gameState.selectedCardIndex];
            
            // 対象選択画面を表示
            document.getElementById('target-select').style.display = 'block';
        }

        // ターゲット選択
        function selectTarget(target) {
            const card = gameState.hand[gameState.selectedCardIndex];
            
            if (target === 'player') {
                applyCardEffect(card, gameState.playerFunction, 'プレイヤー');
                addLog(`${card.name} を自分の関数に使用`, 'player');
            } else {
                applyCardEffect(card, gameState.enemyFunction, '敵');
                addLog(`${card.name} を敵の関数に使用`, 'player');
            }

            // カードを手札から削除
            gameState.hand.splice(gameState.selectedCardIndex, 1);
            gameState.selectedCardIndex = null;
            document.getElementById('btn-use').disabled = true;
            document.getElementById('target-select').style.display = 'none';

            renderHand();
            renderFunctions();
            checkGameEnd();
        }

        // カード効果を適用
        function applyCardEffect(card, func, targetName) {
            if (card.type === 'plus') {
                func.constant += card.level;
            } else if (card.type === 'substitute') {
                // f(x) = ax^n + c に x=card.level を代入
                const x = card.level;
                const result = func.coefficient * Math.pow(x, func.exponent) + func.constant;
                func.coefficient = result;
                func.exponent = 0;
                func.constant = 0;
            } else if (card.type === 'inverse') {
                if (card.level % 2 === 1) {
                    // 逆数化
                    // f(x) → 1/f(x) は複雑なので、簡易的に係数の逆数とする
                    if (func.coefficient !== 0) {
                        func.coefficient = 1 / func.coefficient;
                        func.exponent = -func.exponent;
                        func.constant = -func.constant / func.coefficient;
                    }
                }
                // レベル2（偶数）なら何もしない（無効化）
            }
        }

        // 関数を描画
        function renderFunctions() {
            document.getElementById('player-function').innerHTML = formatFunction(gameState.playerFunction, 'f');
            document.getElementById('enemy-function').innerHTML = formatFunction(gameState.enemyFunction, 'g');
        }

        // 関数を整形
        function formatFunction(func, fname) {
            let result = `${fname}(x) = `;
            
            // 定数のみの場合
            if (func.exponent === 0) {
                const value = func.coefficient + func.constant;
                if (Number.isInteger(value)) {
                    result += value;
                } else {
                    result += formatFraction(value);
                }
                return result;
            }

            // 係数
            if (func.coefficient !== 1 || func.exponent === 0) {
                if (Number.isInteger(func.coefficient)) {
                    result += func.coefficient;
                } else {
                    result += formatFraction(func.coefficient);
                }
            }

            // x^n
            if (func.exponent === 1) {
                result += 'x';
            } else if (func.exponent !== 0) {
                result += `x<sup>${func.exponent}</sup>`;
            }

            // 定数項
            if (func.constant !== 0) {
                if (func.constant > 0) {
                    result += ' + ' + (Number.isInteger(func.constant) ? func.constant : formatFraction(func.constant));
                } else {
                    result += ' - ' + (Number.isInteger(-func.constant) ? -func.constant : formatFraction(-func.constant));
                }
            }

            return result;
        }

        // 分数表記
        function formatFraction(num) {
            if (Number.isInteger(num)) return num.toString();
            
            const precision = 1000000;
            let numerator = Math.round(num * precision);
            let denominator = precision;
            
            // 最大公約数で約分
            const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
            const divisor = gcd(Math.abs(numerator), denominator);
            numerator /= divisor;
            denominator /= divisor;
            
            if (denominator === 1) return numerator.toString();
            return `${numerator}/${denominator}`;
        }

        // 合成モード切り替え
        function toggleMergeMode() {
            gameState.mergeMode = !gameState.mergeMode;
            gameState.selectedForMerge = [];
            
            if (gameState.mergeMode) {
                document.getElementById('merge-indicator').style.display = 'block';
                document.getElementById('btn-use').disabled = true;
                gameState.selectedCardIndex = null;
            } else {
                document.getElementById('merge-indicator').style.display = 'none';
            }
            
            renderHand();
        }

        // カード合成を試みる
        function attemptMerge() {
            const [index1, index2] = gameState.selectedForMerge;
            const card1 = gameState.hand[index1];
            const card2 = gameState.hand[index2];

            // 同じタイプ・同じレベルかチェック
            if (card1.type === card2.type && card1.level === card2.level) {
                // 合成成功
                const newCard = {
                    ...card1,
                    level: card1.level + 1,
                    id: Date.now()
                };

                // 古いカードを削除（インデックスが大きい方から）
                const indicesToRemove = [index1, index2].sort((a, b) => b - a);
                indicesToRemove.forEach(i => gameState.hand.splice(i, 1));

                // 新しいカードを手札の先頭に追加
                gameState.hand.unshift(newCard);

                addLog(`${card1.name} を合成してLv${newCard.level}にアップグレード！`, 'player');
                
                // 合成したらターン終了
                gameState.mergeMode = false;
                gameState.selectedForMerge = [];
                document.getElementById('merge-indicator').style.display = 'none';
                
                renderHand();
                setTimeout(() => endTurn(), 500);
            } else {
                addLog('合成失敗: 同じタイプ・同じレベルのカードを選択してください', 'player');
                gameState.selectedForMerge = [];
                renderHand();
            }
        }

        // ターン終了
        function endTurn() {
            if (gameState.mergeMode) {
                // 合成モードをキャンセル
                gameState.mergeMode = false;
                gameState.selectedForMerge = [];
                document.getElementById('merge-indicator').style.display = 'none';
                renderHand();
                return;
            }

            // カードを補充（+1カードを1枚追加）
            if (gameState.hand.length < 5) {
                const newCard = { ...cardTypes.plus, level: 1, id: Date.now() };
                gameState.hand.unshift(newCard); // 左端に追加
                addLog('+1カードを補充', 'player');
            }

            renderHand();

            // 敵のターン
            gameState.turn = 'enemy';
            document.getElementById('turn-indicator').textContent = '敵のターン';
            
            setTimeout(() => {
                executeEnemyTurn();
            }, 1000);
        }

        // 敵の次の行動を決定
        function decideEnemyNextAction() {
            // プレイヤーの関数を0にする最適な行動を選択
            const playerFunc = gameState.playerFunction;
            
            // 簡易AI: プレイヤー関数が x-2 なら、x=1代入で-1になるので逆数を使って負にする
            // または x=2を代入して0にする
            
            const actions = ['plus', 'substitute', 'inverse'];
            
            // x=2代入カードがあればそれを使う（レベル2の代入カード）
            if (Math.random() > 0.3) {
                gameState.enemyNextAction = { type: 'substitute', level: 2 };
            } else if (Math.random() > 0.5) {
                gameState.enemyNextAction = { type: 'inverse', level: 1 };
            } else {
                gameState.enemyNextAction = { type: 'plus', level: 1 };
            }

            updateEnemyNextActionDisplay();
        }

        // 敵の次の行動を表示
        function updateEnemyNextActionDisplay() {
            const action = gameState.enemyNextAction;
            let actionText = '';
            
            if (action.type === 'plus') {
                actionText = `+${action.level}カード使用`;
            } else if (action.type === 'substitute') {
                actionText = `x=${action.level}代入カード使用`;
            } else if (action.type === 'inverse') {
                actionText = '逆数カード使用';
            }

            document.getElementById('enemy-next-action').textContent = `次の行動: ${actionText}`;
        }

        // 敵のターンを実行
        function executeEnemyTurn() {
            const action = gameState.enemyNextAction;
            
            // カード効果をプレイヤー関数に適用
            const card = {
                type: action.type,
                level: action.level,
                name: action.type === 'plus' ? `+${action.level}カード` : 
                      action.type === 'substitute' ? `x=${action.level}代入カード` : '逆数カード'
            };
            
            applyCardEffect(card, gameState.playerFunction, 'プレイヤー');
            addLog(`敵が ${card.name} を使用！`, 'enemy');

            renderFunctions();
            checkGameEnd();

            // 次の行動を決定
            decideEnemyNextAction();

            // プレイヤーのターンに戻る
            gameState.turn = 'player';
            document.getElementById('turn-indicator').textContent = 'プレイヤーのターン';
        }

        // ゲーム終了チェック
        function checkGameEnd() {
            const playerValue = evaluateFunction(gameState.playerFunction);
            const enemyValue = evaluateFunction(gameState.enemyFunction);

            if (playerValue === 0 || isNaN(playerValue) || !isFinite(playerValue)) {
                showModal('defeat', '敗北', 'あなたの関数が無効になりました...');
                return true;
            }

            if (enemyValue === 0 || isNaN(enemyValue) || !isFinite(enemyValue)) {
                showModal('victory', '勝利！', '敵の関数を無効化しました！');
                return true;
            }

            return false;
        }

        // 関数を評価（x=1での値を返す、主にチェック用）
        function evaluateFunction(func) {
            if (func.exponent === 0) {
                return func.coefficient + func.constant;
            }
            return func.coefficient * Math.pow(1, func.exponent) + func.constant;
        }

        // モーダル表示
        function showModal(type, title, message) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modal-content');
            
            modalContent.className = `modal-content ${type}`;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            
            modal.classList.add('active');
        }

        // ログ追加
        function addLog(message, type) {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = message;
            log.insertBefore(entry, log.firstChild);

            // ログが多すぎたら古いものを削除
            while (log.children.length > 10) {
                log.removeChild(log.lastChild);
            }
        }

        // ゲーム開始
        init();
    </script>
</body>
</html>
